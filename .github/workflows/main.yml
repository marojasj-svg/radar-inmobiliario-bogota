name: Monitor Inmobiliario Zona Norte

on:
  push:
    paths:
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      forzar_captura:
        description: "Volver a consultar los portales aunque ya exista un corte hoy"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: radar-inmobiliario-captura
  cancel-in-progress: false

jobs:
  rastrear-y-analizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar captura de datos (Scraper)
        env:
          SCRAPPA_API_KEY: ${{ secrets.SCRAPPA_API_KEY }}
          FORZAR_CAPTURA: ${{ github.event_name != 'workflow_dispatch' || inputs.forzar_captura }}
        run: python src/scraper.py

      - name: Ejecutar análisis de dinámica y generar notas Obsidian
        run: python src/analizador.py

      - name: Guardar cambios en el repositorio
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Radar Inmobiliario Bot"
          git add data/ obsidian_vault/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática radar inmobiliario $(date +'%Y-%m-%d')" && git push)
